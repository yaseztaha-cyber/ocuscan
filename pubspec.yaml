name: ocuscan
description: "OcuScan - privacy-first smartphone eye and facial screening prototype"
publish_to: 'none'
version: 0.7.24+32

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.0
  image: ^4.2.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  permission_handler: ^13.0.2
  provider: ^6.1.2
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  device_info_plus: ^13.3.0
  path_provider: ^2.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/medical_evidence.json
    - assets/risk_management.json
    - assets/detection_catalog.json
    - assets/bundled_face.jpg
  fonts:
    # Tajawal (SIL Open Font License 1.1, see assets/fonts/OFL.txt):
    # clean geometric sans with full Arabic shaping — offline typography
    # for both English and Arabic UI.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
